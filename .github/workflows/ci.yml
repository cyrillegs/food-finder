# CI for Food Finder.
#
# `runs-on` reads a repository variable rather than a hardcoded value, on
# purpose — the same pattern used for Delta's self-hosted runner. If the
# runner is offline, mid-redeploy, or repointed at a different project (see
# infra/runner/README.md), `runs-on` does not fail over: jobs just queue
# forever with no error. A repo variable is a one-click revert; a workflow
# edit needs a commit, which needs CI, which is the thing that stopped.
#
# Unset (the default) -> ubuntu-latest. Set CI_RUNNER=self-hosted only after
# confirming the runner shows status=online for THIS repo:
#   gh api repos/cyrillegs/food-finder/actions/runners --jq '.runners[]'

name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: food_finder_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: mysql://root:root@localhost:3306/food_finder_test
      PORT: "4000"
      CORS_ORIGIN: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply migrations
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Generate client
        working-directory: apps/api
        run: npx prisma generate

      # --passWithNoTests: master has no test files yet as of this workflow's
      # own PR (Module 1's search.test.ts is still on an unmerged branch) -
      # a repo genuinely having zero tests isn't a CI failure, an actual
      # failing test still is.
      - name: Test
        working-directory: apps/api
        run: npm test -- --passWithNoTests

  web:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      # No test script exists in apps/web yet (Module 0/1 didn't add a
      # frontend test runner) - build is the only real smoke check available
      # right now. Add a `test` step here once one exists, don't invent one
      # just to fill this in.
      - name: Build
        working-directory: apps/web
        run: npm run build

  # Actually builds both production Dockerfiles, on every PR - not just the
  # source-level api/web checks above, which never touch the Dockerfiles at
  # all. Without this, a broken Dockerfile only surfaces post-merge, when
  # the deploy job below tries to build it on Dokploy - matches Delta's own
  # `images` job for the same reason (build context is the repo root, see
  # the comment at the top of each Dockerfile). No ZAP scan here (Delta's
  # was tied to a specific compliance commitment that doesn't apply here) -
  # just confirms both images actually build.
  images:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Build api image
        run: docker build -f apps/api/Dockerfile -t food-finder-api:ci .

      - name: Build web image
        run: |
          docker build -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_BASE_URL=https://food-finder-api.cdlegaspi.site \
            -t food-finder-web:ci .

  # Deploys web/api on Dokploy after both gates above pass. main only, so PR
  # builds never deploy. There is no staging here (unlike Delta) - one
  # environment, so this goes straight to the only Dokploy project that
  # exists for this repo.
  #
  # DOKPLOY_URL/DOKPLOY_API_KEY are repo secrets (an admin-scoped Dokploy
  # token - a restricted member token was tried first during initial setup
  # and turned out not to have project/service-creation rights at all,
  # see docs history). Application ids are NOT secret - they only name
  # which containers a merge restarts, same reasoning Delta's own ci.yml
  # documents - the API key is the actual secret.
  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: [api, web, images]
    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      API_APP_ID: "ABs8Tg47H_-gk-U_ys8I6"
      WEB_APP_ID: "LRiKeO5sKh5bWj5gqPfkI"

    steps:
      - name: Deploy api
        run: |
          curl -fsS -X POST -H "x-api-key: $DOKPLOY_KEY" -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$API_APP_ID\"}" "$DOKPLOY_URL/api/application.deploy" >/dev/null

      # Dokploy's deploy call queues the build and returns immediately - a
      # 2xx here means "accepted", not "live". Poll application.one until it
      # reports done, the same way this project's own manual deploys were
      # verified throughout development. No status=error case observed from
      # Dokploy in practice; treat "never reaches done" (timeout) as the
      # failure signal rather than relying on a specific error state.
      - name: Wait for api
        run: |
          for _ in $(seq 1 30); do
            status=$(curl -fsS "$DOKPLOY_URL/api/application.one?applicationId=$API_APP_ID" -H "x-api-key: $DOKPLOY_KEY" | jq -r .applicationStatus)
            echo "api status: $status"
            [ "$status" = "done" ] && exit 0
            sleep 10
          done
          echo "Timed out waiting for api to finish deploying"
          exit 1

      - name: Deploy web
        run: |
          curl -fsS -X POST -H "x-api-key: $DOKPLOY_KEY" -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$WEB_APP_ID\"}" "$DOKPLOY_URL/api/application.deploy" >/dev/null

      - name: Wait for web
        run: |
          for _ in $(seq 1 30); do
            status=$(curl -fsS "$DOKPLOY_URL/api/application.one?applicationId=$WEB_APP_ID" -H "x-api-key: $DOKPLOY_KEY" | jq -r .applicationStatus)
            echo "web status: $status"
            [ "$status" = "done" ] && exit 0
            sleep 10
          done
          echo "Timed out waiting for web to finish deploying"
          exit 1

      # A "done" deploy status is Dokploy's own bookkeeping, not proof the
      # app is actually serving traffic - confirm both are real.
      - name: Health check
        run: |
          curl -fsS https://food-finder-api.cdlegaspi.site/health
          echo
          curl -fsS -o /dev/null https://food-finder.cdlegaspi.site/en
          echo "web OK"
